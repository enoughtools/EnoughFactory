name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin, arch: arm64, rid: osx-arm64, runner: macos-15, installedResources: releases/mac-arm64/EnoughFactory.app/Contents/Resources }
          - { platform: linux, arch: x64, rid: linux-x64, runner: ubuntu-24.04, installedResources: releases/linux-unpacked/resources }
          - { platform: linux, arch: arm64, rid: linux-arm64, runner: ubuntu-24.04-arm, installedResources: releases/linux-arm64-unpacked/resources }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and tagged version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          pnpm typecheck
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const version = JSON.parse(await readFile('package.json', 'utf8')).version;
          if (process.env.RELEASE_REF.startsWith('refs/tags/') && process.env.RELEASE_REF !== `refs/tags/v${version}`) throw new Error('Release tag must match the package version.');
          NODE
      - name: Publish native engine
        run: node scripts/envmux-build.mjs "${{ matrix.rid }}"
      - name: Build application bundles
        run: node scripts/package-desktop.mjs --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installed runtime on its native architecture
        run: node scripts/check-desktop-bundle.mjs --resources "${{ matrix.installedResources }}"
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: EnoughFactory-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            releases/*.dmg
            releases/*.zip
            releases/*.AppImage
            releases/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: EnoughFactory-*
          path: releases
          merge-multiple: true
      - name: Record artifact hashes and release provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const files = (await readdir('releases')).filter(name => /\.(dmg|zip|AppImage|tar\.gz)$/.test(name)).sort();
          const entries = await Promise.all(files.map(async name => {
            const bytes = await readFile(`releases/${name}`);
            return { name, size: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex'), signing: 'unsigned' };
          }));
          await writeFile('releases/SHA256SUMS', entries.map(file => `${file.sha256}  ${file.name}`).join('\n') + '\n');
          await writeFile('releases/provenance.json', JSON.stringify({ version: process.env.RELEASE_TAG, commit: process.env.RELEASE_COMMIT, artifacts: entries }, null, 2) + '\n');
          NODE
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "EnoughFactory $RELEASE_TAG" --notes "Mac Apple Silicon and Linux x64/ARM64 desktop bundles. These initial builds are unsigned. Bundles include the device service, Node runtime, envmux engine, web interface and dependency notices. Docker-compatible engine and provider sign-in are configured during onboarding."
          fi
          gh release upload "$RELEASE_TAG" releases/*.dmg releases/*.zip releases/*.AppImage releases/*.tar.gz releases/SHA256SUMS releases/provenance.json --clobber
