name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin, arch: arm64, rid: osx-arm64, runner: macos-15, installedResources: releases/mac-arm64/EnoughFactory.app/Contents/Resources }
          - { platform: linux, arch: x64, rid: linux-x64, runner: ubuntu-24.04, installedResources: releases/linux-unpacked/resources }
          - { platform: linux, arch: arm64, rid: linux-arm64, runner: ubuntu-24.04-arm, installedResources: releases/linux-arm64-unpacked/resources }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and tagged version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          pnpm typecheck
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const version = JSON.parse(await readFile('package.json', 'utf8')).version;
          if (process.env.RELEASE_REF.startsWith('refs/tags/') && process.env.RELEASE_REF !== `refs/tags/v${version}`) throw new Error('Release tag must match the package version.');
          NODE
      - name: Publish native engine
        run: node scripts/envmux-build.mjs "${{ matrix.rid }}"
      - name: Build application bundles
        run: node scripts/package-desktop.mjs --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installed runtime on its native architecture
        run: node scripts/check-desktop-bundle.mjs --resources "${{ matrix.installedResources }}" --receipt "releases/${{ matrix.platform }}-${{ matrix.arch }}.installed.verification.json" --source-commit "$GITHUB_SHA"
      - name: Prepare Linux user namespaces in this disposable runner
        if: matrix.platform == 'linux'
        env:
          INSTALLED_RESOURCES: ${{ matrix.installedResources }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y uidmap iptables
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { userInfo } from 'node:os';
          const user = userInfo();
          for (const [file, flag] of [['/etc/subuid', '--add-subuids'], ['/etc/subgid', '--add-subgids']]) {
            const entries = (await readFile(file, 'utf8')).trim().split('\n').filter(Boolean).map(line => line.split(':'));
            if (entries.some(([owner, , count]) => (owner === user.username || owner === String(user.uid)) && Number(count) >= 65536)) continue;
            const start = Math.max(100000, ...entries.map(([, first, count]) => Number(first) + Number(count)));
            execFileSync('sudo', ['usermod', flag, `${start}-${start + 65535}`, user.username]);
          }
          NODE
          cat <<EOF | sudo tee /etc/apparmor.d/enoughfactory-ci-rootlesskit >/dev/null
          abi <abi/4.0>,
          include <tunables/global>
          profile enoughfactory-ci-rootlesskit "$GITHUB_WORKSPACE/$INSTALLED_RESOURCES/runtime/container/docker/bin/rootlesskit" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/enoughfactory-ci-rootlesskit
      - name: Verify the bundled private Linux engine and source retention
        if: matrix.platform == 'linux'
        run: |
          pnpm exec esbuild scripts/check-linux-runtime.ts --bundle --platform=node --format=esm --outfile=.cache/check-linux-runtime.mjs
          "${{ matrix.installedResources }}/runtime/node" .cache/check-linux-runtime.mjs --assets "${{ matrix.installedResources }}/runtime/container" --envmux "${{ matrix.installedResources }}/envmux/envmux" --bundle-provenance "${{ matrix.installedResources }}/bundle-provenance.json" --receipt "releases/${{ matrix.platform }}-${{ matrix.arch }}.runtime.verification.json"
      - name: Verify the exact downloadable archives
        env:
          RUNTIME_RECEIPT: releases/${{ matrix.platform }}-${{ matrix.arch }}.runtime.verification.json
        run: |
          node --input-type=module <<'NODE'
          import { readdir, access } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          let runtimeReceipt;
          try { await access(process.env.RUNTIME_RECEIPT); runtimeReceipt = process.env.RUNTIME_RECEIPT; } catch {}
          for (const name of (await readdir('releases')).filter(name => /\.(dmg|zip|AppImage|tar\.gz)$/.test(name)).sort()) {
            const args = ['scripts/check-desktop-archive.mjs', '--artifact', `releases/${name}`, '--receipt', `releases/${name}.verification.json`, '--source-commit', process.env.GITHUB_SHA];
            if (runtimeReceipt) args.push('--runtime-receipt', runtimeReceipt);
            execFileSync(process.execPath, args, { stdio: 'inherit' });
          }
          NODE
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: EnoughFactory-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            releases/*.dmg
            releases/*.zip
            releases/*.AppImage
            releases/*.tar.gz
            releases/*.verification.json
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: EnoughFactory-*
          path: releases
          merge-multiple: true
      - name: Record artifact hashes and release provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const files = (await readdir('releases')).filter(name => /\.(dmg|zip|AppImage|tar\.gz)$/.test(name)).sort();
          const entries = await Promise.all(files.map(async name => {
            const bytes = await readFile(`releases/${name}`);
            return { name, size: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex'), signing: 'unsigned' };
          }));
          await writeFile('releases/SHA256SUMS', entries.map(file => `${file.sha256}  ${file.name}`).join('\n') + '\n');
          await writeFile('releases/provenance.json', JSON.stringify({ version: process.env.RELEASE_TAG, commit: process.env.RELEASE_COMMIT, artifacts: entries }, null, 2) + '\n');
          NODE
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "EnoughFactory $RELEASE_TAG" --notes "Mac Apple Silicon and Linux x64/ARM64 desktop bundles. These initial builds are unsigned. Bundles include a private container runtime, device service, Node runtime, envmux engine, web interface and dependency notices. First launch prepares EnoughFactory's own runtime and dedicated socket. Provider sign-in is configured during onboarding."
          fi
          gh release upload "$RELEASE_TAG" releases/*.dmg releases/*.zip releases/*.AppImage releases/*.tar.gz releases/*.verification.json releases/SHA256SUMS releases/provenance.json --clobber
