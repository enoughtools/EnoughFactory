name: Verify unchanged Linux x64 AppImage

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Native archive proof for v0.1.1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
      - name: Fetch the unchanged successful native build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: EnoughFactory-linux-x64
          run-id: 37379810420
          github-token: ${{ github.token }}
          path: .cache/appimage-proof
      - name: Normalize the download filename without changing its bytes
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { createReadStream } from 'node:fs';
          import { rename } from 'node:fs/promises';
          const original = '.cache/appimage-proof/EnoughFactory-0.1.1-linux-x86_64.AppImage';
          const canonical = '.cache/appimage-proof/EnoughFactory-0.1.1-linux-x64.AppImage';
          async function fingerprint(path) {
            const hash = createHash('sha256'); let bytes = 0;
            for await (const chunk of createReadStream(path)) { hash.update(chunk); bytes += chunk.length; }
            return { sha256: hash.digest('hex'), bytes };
          }
          const before = await fingerprint(original);
          if (before.sha256 !== '8da5eb76eb975c6097aaa41530bfbee94d1a4f859e7ed07adf980a31732d58b3' || before.bytes !== 371578634) throw new Error('The downloaded AppImage differs from the selected release bytes.');
          await rename(original, canonical);
          const after = await fingerprint(canonical);
          if (after.sha256 !== before.sha256 || after.bytes !== before.bytes) throw new Error('Filename normalization changed the AppImage.');
          console.log(JSON.stringify(after));
          NODE
      - name: Verify the exact native archive with its existing runtime journey
        run: node scripts/check-desktop-archive.mjs --artifact .cache/appimage-proof/EnoughFactory-0.1.1-linux-x64.AppImage --receipt .cache/appimage-proof/EnoughFactory-0.1.1-linux-x64.AppImage.verification.json --source-commit 5252bd83a9082d7711e7e3dcbf426daef0abc165 --runtime-receipt .cache/appimage-proof/linux-x64.runtime.verification.json
      - name: Upload only the new archive receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: EnoughFactory-linux-x64-AppImage-proof
          path: .cache/appimage-proof/EnoughFactory-0.1.1-linux-x64.AppImage.verification.json
          if-no-files-found: error
          retention-days: 30
