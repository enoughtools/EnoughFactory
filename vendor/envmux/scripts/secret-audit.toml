betterleaksMinVersion = "1.9.0"

# Suppress individual findings only when both the path and the published
# fixture value match. Never skip a whole test file before detection.
filter = '''
(filter.matchesAny(attributes["path"], [`(^|/)tests/Envmux.Tests/EndToEnd/ProofOfLifeTests\.cs$`, `(^|/)spikes/kube-ingressive/verify\.sh$`]) && finding["secret"] == "dGhlIHNhbXBsZSBub25jZQ==") ||
(filter.matchesAny(attributes["path"], [`(^|/)tests/Envmux.Tests/DotEnvTests\.cs$`]) && finding["secret"] == "bWF0dDpzZWNyZXQ=") ||
(filter.matchesAny(attributes["path"], [`(^|/)tests/Envmux.Tests/DockerEngineTests\.cs$`]) && finding["rule_id"] == "generic-credential-uri" && finding["secret"] == "private-value") ||
(filter.matchesAny(attributes["path"], [`(^|/)tests/Envmux.Tests/PinnedUrlTests\.cs$`]) && finding["rule_id"] == "generic-credential-uri" && finding["secret"] == "pw") ||
(filter.matchesAny(attributes["path"], [`(^|/)tests/Envmux.Tests/IncusTests\.cs$`]) && finding["rule_id"] == "generic-password" && finding["secret"] == "secret") ||
(filter.matchesAny(attributes["path"], [`(^|/)spikes/socks-browser/socks\.cs$`]) && finding["rule_id"] == "generic-password" && finding["secret"] == "s3cret") ||
(filter.matchesAny(attributes["path"], [`(^|/)tests/Envmux.Tests/ServiceTests\.cs$`]) && finding["rule_id"] == "generic-password" && finding["secret"] in ["hunter2", "p@ss/word"]) ||
(filter.matchesAny(attributes["path"], [`(^|/)tests/Envmux.Tests/ServiceCredentialsTests\.cs$`]) && finding["rule_id"] == "generic-password" && finding["secret"] == "second-session-password") ||
(filter.matchesAny(attributes["path"], [`(^|/)tests/Envmux.Tests/GitCredentialsTests\.cs$`]) && finding["rule_id"] in ["generic-password", "generic-credential-uri"] && finding["secret"] in ["ghp_secret", "p%40ss%3Aw%2Frd", "token"]) ||
(filter.matchesAny(attributes["path"], [`(^|/)docs/pages/services\.md$`]) && finding["rule_id"] in ["generic-password", "generic-credential-uri"] && finding["secret"] in ["cVD5iu...", "cVD5iu…", "something-you-chose"])
'''

[extend]
useDefault = true
